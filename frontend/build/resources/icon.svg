<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <g transform="translate(0, 15)">
  <!-- 书堆 -->
  <g opacity="0.95">
    <rect x="60" y="380" width="392" height="40" rx="4" fill="url(#b3)"/>
    <rect x="70" y="370" width="12" height="50" rx="2" fill="#0e7490" opacity="0.5"/>
    <rect x="48" y="340" width="416" height="44" rx="4" fill="url(#b2)"/>
    <rect x="60" y="330" width="12" height="54" rx="2" fill="#a16207" opacity="0.5"/>
    <rect x="36" y="300" width="440" height="44" rx="4" fill="url(#b1)"/>
    <rect x="48" y="290" width="12" height="54" rx="2" fill="#991b1b" opacity="0.5"/>
  </g>

  <!-- AI 神经网络（加粗） -->
  <g stroke="#38bdf8" stroke-width="5" opacity="0.35" fill="none" stroke-linecap="round">
    <line x1="120" y1="300" x2="160" y2="240"/>
    <line x1="160" y1="240" x2="125" y2="160"/>
    <line x1="160" y1="240" x2="230" y2="190"/>
    <line x1="230" y1="190" x2="256" y2="115"/>
    <line x1="256" y1="115" x2="256" y2="65"/>
    <line x1="256" y1="115" x2="300" y2="170"/>
    <line x1="300" y1="170" x2="350" y2="95"/>
    <line x1="300" y1="170" x2="380" y2="230"/>
    <line x1="380" y1="230" x2="392" y2="300"/>
    <line x1="256" y1="65" x2="210" y2="35"/>
    <line x1="256" y1="65" x2="302" y2="35"/>
  </g>

  <!-- 节点（加粗） -->
  <circle cx="160" cy="240" r="14" fill="#38bdf8"/>
  <circle cx="230" cy="190" r="12" fill="#0ea5e9"/>
  <circle cx="300" cy="170" r="12" fill="#0ea5e9"/>
  <circle cx="380" cy="230" r="14" fill="#38bdf8"/>
  <circle cx="125" cy="160" r="10" fill="#38bdf8"/>
  <circle cx="350" cy="95" r="10" fill="#22d3ee"/>

  <circle cx="256" cy="115" r="22" fill="#22d3ee" stroke="#fff" stroke-width="4"/>
  <text x="256" y="123" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">AI</text>

  <circle cx="256" cy="65" r="12" fill="#22d3ee"/>
  <circle cx="210" cy="35" r="9" fill="#38bdf8" opacity="0.6"/>
  <circle cx="302" cy="35" r="9" fill="#38bdf8" opacity="0.6"/>
  </g>
