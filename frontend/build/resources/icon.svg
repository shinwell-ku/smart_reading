<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <g transform="translate(-15, 30) scale(1.3)">
  <!-- ========== 书堆（三本书，模拟 📚） ========== -->
  <g filter="url(#shadow)">
    <!-- 底书（蓝色） -->
    <rect x="140" y="280" width="232" height="28" rx="4" fill="url(#b3)"/>
    <rect x="152" y="270" width="8" height="38" rx="1" fill="#0e7490" opacity="0.4"/>

    <!-- 中书（黄色） -->
    <rect x="130" y="252" width="252" height="30" rx="4" fill="url(#b2)"/>
    <rect x="142" y="242" width="8" height="40" rx="1" fill="#a16207" opacity="0.4"/>

    <!-- 顶书（红色） -->
    <rect x="120" y="224" width="272" height="32" rx="4" fill="url(#b1)"/>
    <rect x="132" y="214" width="8" height="42" rx="1" fill="#991b1b" opacity="0.4"/>

    <!-- 书脊装饰条纹 -->
    <line x1="145" y1="232" x2="145" y2="248" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="155" y1="260" x2="155" y2="274" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="165" y1="288" x2="165" y2="300" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- ========== AI 神经网络（从书中向上生长） ========== -->
  <g filter="url(#glow)">
    <!-- 连接线 -->
    <g stroke="#38bdf8" stroke-width="2.5" opacity="0.4" fill="none">
      <line x1="180" y1="224" x2="200" y2="180"/>
      <line x1="200" y1="180" x2="185" y2="130"/>
      <line x1="200" y1="180" x2="240" y2="140"/>
      <line x1="240" y1="140" x2="256" y2="90"/>
      <line x1="256" y1="90" x2="256" y2="55"/>
      <line x1="256" y1="90" x2="290" y2="130"/>
      <line x1="290" y1="130" x2="310" y2="80"/>
      <line x1="290" y1="130" x2="330" y2="170"/>
      <line x1="330" y1="170" x2="310" y2="224"/>
      <line x1="256" y1="55" x2="226" y2="35"/>
      <line x1="256" y1="55" x2="286" y2="35"/>
    </g>

    <!-- 节点 -->
    <circle cx="200" cy="180" r="9" fill="#38bdf8"/>
    <circle cx="240" cy="140" r="8" fill="#0ea5e9"/>
    <circle cx="290" cy="130" r="8" fill="#0ea5e9"/>
    <circle cx="330" cy="170" r="9" fill="#38bdf8"/>
    <circle cx="185" cy="130" r="7" fill="#38bdf8"/>
    <circle cx="310" cy="80" r="7" fill="#22d3ee"/>
    <!-- 大脑核心节点（AI 文字标记） -->
    <circle cx="256" cy="90" r="16" fill="#22d3ee" stroke="#fff" stroke-width="2.5"/>
    <text x="256" y="96" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
    <!-- 顶端发散节点 -->
    <circle cx="256" cy="55" r="9" fill="#22d3ee"/>
    <circle cx="226" cy="35" r="6" fill="#38bdf8" opacity="0.7"/>
    <circle cx="286" cy="35" r="6" fill="#38bdf8" opacity="0.7"/>
  </g>

  </g>
</svg>
